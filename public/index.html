<!DOCTYPE html>
<html lang = "en">
    <head>
        <link rel="stylesheet" href="styles.css">
        <meta charset="UTF-8"/>
        <title>Personal Recipe Collection</title>
    </head>

    <body>
        <h1>Personal Recipe Collection</h1>

        <form id = "recipe-form">
            <h2>Add a Recipe</h2>
            <input type="text" id="title" placeholder="Recipe title" required />
            <select id="category">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="dessert">Dessert</option>
                <option value="snack">Snack</option>
            </select>
            <input type="number" id="prep_time" placeholder="Prep time (minutes)" min="1" required />
            <textarea id="ingredients" rows="4" placeholder="Ingredients (one per line)" required></textarea>
            <textarea id="instructions" rows="4" placeholder="Instructions" required></textarea>
            <input type="url" id="image_url" placeholder="Image URL (optional)" />
            <button type="submit">Add Recipe</button>
        </form>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by recipe title..." />
            <select id="filter-category">
                <option value="">All Categories</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="dessert">Dessert</option>
                <option value="snack">Snack</option>
            </select>
            <button id="search-btn" type="button">Search</button>
        </div>

        <div id="recipes-container"></div>

        <script src="app.js"></script>
    </body>

</html>
