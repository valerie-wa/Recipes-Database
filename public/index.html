<!DOCTYPE html>
<html lang = "en">
    <head>
        <link rel="stylesheet" href="styles.css">
        <meta charset="UTF-8"/>
        <title>Personal Recipe Collection</title>
        <style>
            body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
            form, .search-bar { display: grid; gap: 0.75rem; margin-bottom: 2rem; background: #f8f9fa; padding: 1rem; border-radius: 8px; }
            .search-bar { grid-template-columns: 1fr auto auto; }
            input, textarea, select, button { padding: 0.5rem; font-size: 1rem; }
            button { cursor: pointer; }
            .recipe-card { border: 1px solid #ddd; border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
            .recipe-header { display: flex; justify-content: space-between; align-items: center; }
            .delete-btn { background: #dc3545; color: white; border: none; border-radius: 4px; padding: 0.4rem 0.8rem; }
        </style>
    </head>

    <body>
        <h1>Personal Recipe Collection</h1>

        <form id = "recipe-form">
            <h2>Add a Recipe</h2>
            <input type="text" id="title" placeholder="Recipe title" required />
            <select id="category">
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="dessert">Dessert</option>
                <option value="snack">Snack</option>
            </select>
            <input type="number" id="prep_time" placeholder="Prep time (minutes)" min="1" required />
            <textarea id="ingredients" rows="4" placeholder="Ingredients (one per line)" required></textarea>
            <textarea id="instructions" rows="4" placeholder="Instructions" required></textarea>
            <input type="url" id="image_url" placeholder="Image URL (optional)" />
            <button type="submit">Add Recipe</button>
        </form>

        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search by recipe title..." />
            <select id="filter-category">
                <option value="">All Categories</option>
                <option value="breakfast">Breakfast</option>
                <option value="lunch">Lunch</option>
                <option value="dinner">Dinner</option>
                <option value="dessert">Dessert</option>
                <option value="snack">Snack</option>
            </select>
            <button id="search-btn" type="button">Search</button>
        </div>

        <div id="recipes-container"></div>

        <script src="app.js"></script>
    </body>

</html>
